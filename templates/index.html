<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glimpse: Intelligent Face Recognition Platform</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <style>
        .drag-area {
            border: 2px dashed #cccccc;
            height: 300px;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
        }
        .drag-area.highlight {
            border-color: #2563eb;
        }
        .loading-spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #09f;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-12">
        <header class="text-center mb-10">
            <h1 class="text-3xl font-bold text-blue-600">Glimpse: Intelligent Face Recognition Platform</h1>
            <p class="text-gray-600 mt-2">Upload a solo photo and a group photo to find matches</p>
        </header>
        
        <div class="grid md:grid-cols-2 gap-6">
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-semibold mb-4">Solo Photo</h2>
                <div id="solo-drop-area" class="drag-area flex flex-col items-center justify-center cursor-pointer">
                    <div id="solo-default" class="text-center">
                        <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                            <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        <p class="mt-1 text-sm text-gray-600">Drag and drop a solo photo or click to upload</p>
                    </div>
                </div>
                <input type="file" id="solo-input" accept="image/*" class="hidden">
            </div>
            
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-semibold mb-4">Group Photo</h2>
                <div id="group-drop-area" class="drag-area flex flex-col items-center justify-center cursor-pointer">
                    <div id="group-default" class="text-center">
                        <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                            <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        <p class="mt-1 text-sm text-gray-600">Drag and drop a group photo or click to upload</p>
                    </div>
                </div>
                <input type="file" id="group-input" accept="image/*" class="hidden">
            </div>
        </div>
        
        <div class="flex justify-center mt-8">
            <button id="analyze-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-md disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                Analyze Photos
            </button>
        </div>
        
        <div id="loading" class="hidden mt-8 flex flex-col items-center">
            <div class="loading-spinner mb-4"></div>
            <p class="text-gray-600">Processing images... This may take a moment.</p>
        </div>
        
        <div id="results" class="hidden mt-10 bg-white rounded-lg shadow-md p-6">
            <h2 class="text-xl font-semibold mb-4">Results</h2>
            <div id="match-status" class="text-center mb-4"></div>
            <div id="result-image-container" class="mt-4">
                <img id="result-image" class="max-w-full h-auto mx-auto" src="">
            </div>
            <div id="match-details" class="mt-6"></div>
        </div>
    </div>
    
    <script>
        // DOM Elements
        const soloDropArea = document.getElementById('solo-drop-area');
        const groupDropArea = document.getElementById('group-drop-area');
        const soloInput = document.getElementById('solo-input');
        const groupInput = document.getElementById('group-input');
        const analyzeBtn = document.getElementById('analyze-btn');
        const loadingDiv = document.getElementById('loading');
        const resultsDiv = document.getElementById('results');
        const matchStatus = document.getElementById('match-status');
        const resultImage = document.getElementById('result-image');
        const matchDetails = document.getElementById('match-details');
        
        // Form Data
        let soloFile = null;
        let groupFile = null;
        
        // Setup drag & drop and file selection for Solo Photo
        setupDragDrop(soloDropArea, soloInput, file => {
            soloFile = file;
            displayPreview(file, soloDropArea);
            validateForm();
        });
        
        // Setup drag & drop and file selection for Group Photo
        setupDragDrop(groupDropArea, groupInput, file => {
            groupFile = file;
            displayPreview(file, groupDropArea);
            validateForm();
        });
        
        // Setup drag & drop functionality
        function setupDragDrop(dropArea, fileInput, onFileSelected) {
            // Click to select file
            dropArea.addEventListener('click', () => fileInput.click());
            
            // Handle file selection
            fileInput.addEventListener('change', () => {
                if (fileInput.files.length) {
                    onFileSelected(fileInput.files[0]);
                }
            });
            
            // Drag & drop events
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, preventDefaults, false);
            });
            
            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }
            
            // Highlight drop area when item is dragged over it
            ['dragenter', 'dragover'].forEach(eventName => {
                dropArea.addEventListener(eventName, () => {
                    dropArea.classList.add('highlight');
                }, false);
            });
            
            ['dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, () => {
                    dropArea.classList.remove('highlight');
                }, false);
            });
            
            // Handle dropped files
            dropArea.addEventListener('drop', e => {
                if (e.dataTransfer.files.length) {
                    onFileSelected(e.dataTransfer.files[0]);
                }
            }, false);
        }
        
        // Display image preview
        function displayPreview(file, container) {
            const reader = new FileReader();
            reader.onload = e => {
                container.style.backgroundImage = `url(${e.target.result})`;
                
                // Hide default content
                const defaultContent = container.querySelector('div');
                if (defaultContent) {
                    defaultContent.classList.add('hidden');
                }
            };
            reader.readAsDataURL(file);
        }
        
        // Validate form to enable/disable analyze button
        function validateForm() {
            analyzeBtn.disabled = !(soloFile && groupFile);
        }
        
        // Handle analyze button click
        analyzeBtn.addEventListener('click', async () => {
            if (!(soloFile && groupFile)) return;
            
            // Show loading spinner
            loadingDiv.classList.remove('hidden');
            resultsDiv.classList.add('hidden');
            
            // Create form data
            const formData = new FormData();
            formData.append('solo_photo', soloFile);
            formData.append('group_photo', groupFile);
            
            try {
                // Send request to server
                const response = await fetch('/analyze', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                // Hide loading spinner
                loadingDiv.classList.add('hidden');
                
                // Display results
                displayResults(data);
            } catch (error) {
                console.error('Error:', error);
                loadingDiv.classList.add('hidden');
                alert('An error occurred during analysis. Please try again.');
            }
        });
        
        // Display analysis results
        function displayResults(data) {
            resultsDiv.classList.remove('hidden');
            
            // Display match status
            if (data.error) {
                matchStatus.innerHTML = `<div class="text-red-600 font-medium">Error: ${data.error}</div>`;
                return;
            }
            
            // Show match status
            if (data.match_found) {
                matchStatus.innerHTML = `
                    <div class="bg-green-100 text-green-800 px-4 py-3 rounded-md">
                        <span class="font-bold">Match found!</span> The person from the solo photo was found in the group photo.
                    </div>
                `;
            } else {
                matchStatus.innerHTML = `
                    <div class="bg-red-100 text-red-800 px-4 py-3 rounded-md">
                        <span class="font-bold">No match found.</span> ${data.message}
                    </div>
                `;
            }
            
            // Display result image with bounding box (only for matched face)
            if (data.result_image) {
                resultImage.src = data.result_image;
                document.getElementById('result-image-container').classList.remove('hidden');
            } else {
                document.getElementById('result-image-container').classList.add('hidden');
            }
            
            // Display match details - only show the best match if found
            if (data.results && data.results.length > 0) {
                let bestMatch = null;
                
                // Find the best match
                for (const result of data.results) {
                    if (result.is_match) {
                        bestMatch = result;
                        break;
                    }
                }
                
                if (bestMatch) {
                    const similarityPercentage = bestMatch.similarity_percentage.toFixed(1);
                    matchDetails.innerHTML = `
                        <h3 class="text-lg font-medium mb-2">Match Details:</h3>
                        <div class="bg-green-50 border border-green-200 rounded-md p-3">
                            <div class="flex justify-between">
                                <span class="text-green-800">Found Match</span>
                                <span class="text-green-800 font-bold">${similarityPercentage}% Similar</span>
                            </div>
                        </div>
                    `;
                } else {
                    matchDetails.innerHTML = '';
                }
            } else {
                matchDetails.innerHTML = '';
            }
        }
    </script>
</body>
</html>
