<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glimpse: Intelligent Face Recognition Platform</title>
    <link rel="stylesheet" href="static/css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Glimpse: Intelligent Face Recognition Platform</h1>
            <p class="subtitle">Upload a solo photo and a group photo to find matches</p>
        </header>
        
        <div class="photo-upload-grid">
            <div class="upload-box">
                <h2>Solo Photo</h2>
                <div id="solo-drop-area" class="drag-area">
                    <div id="solo-default" class="default-content">
                        <svg class="upload-icon" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                            <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        <p>Drag and drop a solo photo or click to upload</p>
                    </div>
                </div>
                <input type="file" id="solo-input" accept="image/*">
            </div>
            
            <div class="upload-box">
                <h2>Group Photo</h2>
                <div id="group-drop-area" class="drag-area">
                    <div id="group-default" class="default-content">
                        <svg class="upload-icon" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                            <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        <p>Drag and drop a group photo or click to upload</p>
                    </div>
                </div>
                <input type="file" id="group-input" accept="image/*">
            </div>
        </div>
        
        <div class="btn-container">
            <button id="analyze-btn" class="btn-primary" disabled>
                Analyze Photos
            </button>
        </div>
        
        <div id="loading" class="loading-container hidden">
            <div class="loading-spinner"></div>
            <p>Processing images... This may take a moment.</p>
        </div>
        
        <div id="results" class="results-container hidden">
            <h2>Results</h2>
            <div id="match-status" class="match-status"></div>
            <div id="result-image-container" class="result-image-container">
                <img id="result-image" src="">
            </div>
            <div id="match-details" class="match-details"></div>
        </div>
    </div>
    
    <script src="static/js/script.js"></script>
</body>
</html>
